# fly.toml app configuration file generated for chronos-scheduler-pk2026 on 2026-08-04T15:45:11-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chronos-scheduler-pk2026'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  CHRONOS_CHANGE_STREAM_ENABLED = 'false'
  CHRONOS_POLL_INTERVAL_MS = '200'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/actuator/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
