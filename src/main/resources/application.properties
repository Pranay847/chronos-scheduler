spring.application.name=chronos-scheduler

# Points at the compose stack in docker-compose.yml.
#
# replicaSet=rs0 is not decoration. Change streams (§4) and multi-document transactions both
# refuse to run against a standalone mongod, and retrofitting a replica set once there is data
# and configuration to migrate is the kind of chore that gets deferred forever. Standing it up
# on day one costs one line of compose.
# Host-side default. The compose replica set advertises its member as `mongo:27017`, which does
# not resolve outside the compose network, so a discovery-mode client would find the seed node and
# then fail trying to reach the member it was told about. directConnection skips topology
# discovery and talks to the node in front of it; the server is still a replica set member, so
# change streams and transactions remain available.
#
# Containers override this with SPRING_DATA_MONGODB_URI (see docker-compose.yml), where the
# advertised name does resolve and full replica-set discovery is used.
#
# NOTE the prefix: Boot 4 split Mongo configuration in two. Connection concerns (uri, host, port,
# database, credentials) moved to `spring.mongodb.*`; Spring Data concerns (auto-index-creation,
# field naming, gridfs) stayed on `spring.data.mongodb.*`. Writing `spring.data.mongodb.uri` here
# is not an error — it binds to nothing, so the driver silently falls back to its default of
# localhost:27017 and the only symptom is connecting to the wrong database.
spring.mongodb.uri=mongodb://localhost:27017/chronos?directConnection=true

# Spring Data stopped auto-creating indexes from @Indexed in 3.0, and the default stays off
# here: indexes are declared explicitly in MongoIndexInitializer so that idx_claim's field
# order is a visible decision rather than a consequence of annotation placement.
spring.data.mongodb.auto-index-creation=false

# RFC 7807 problem+json for framework-raised errors too, so clients parse one error shape.
spring.mvc.problemdetails.enabled=true

# 8080 everywhere except platforms that assign a port and expect the process to take it (Render,
# Heroku, Cloud Run all inject PORT). Hardcoding 8080 there means the platform health-checks a port
# nothing is listening on, and the only symptom is a deploy that times out with a running process.
server.port=${PORT:8080}

# Chronos tunables - see ChronosProperties.
chronos.max-payload-bytes=262144
chronos.default-timeout-ms=5000
chronos.default-tenant-id=default

# Poll interval. Mean drift is T/2 and worst case T, so 200ms buys sub-second precision -
# which is what a webhook needs. Lower costs CPU on every worker for precision nobody asked for.
chronos.poll-interval-ms=200

# Lease must outlive queue wait + the request + the reaper's period, not merely twice the
# timeout. LeaseSanityCheck refuses to start if this drops below 3x default-timeout-ms; the
# scheduler.lease.lost counter is what tells you whether the real margin is big enough.
chronos.lease-duration-ms=30000
chronos.claim-batch-size=50
chronos.max-in-flight=200
chronos.due-depth-refresh-ms=10000

# Reaper. The interval is a term in the lease inequality, not a free knob: a job can sit expired
# for up to one full interval before anyone notices, so the lease has to cover it.
chronos.reaper-interval-ms=10000
chronos.reclaim-backoff-ms=5000
chronos.max-claims=10

# Log the worker id on every line. With three containers writing to one stream, an interleaved
# log without it is unreadable - and the whole point of Phase 3 is watching work move between
# workers when one of them dies.
logging.pattern.level=%5p [${spring.application.name:},%X{workerId:-},%X{jobId:-}]

# Give the app a chance to hand back its claims before the JVM exits. Without this the container
# is killed mid-shutdown and PollerService#shutdown never gets to release anything.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Boot 4 turned metrics export OFF by default (management.defaults.metrics.export.enabled=false).
# Without this line the whole Prometheus auto-configuration backs off: no PrometheusMeterRegistry
# bean, no /actuator/prometheus, 404 on scrape - and no error anywhere, because a disabled
# exporter is a legitimate configuration. Everything else looks healthy, including the
# `metrics` endpoint, which is served by the SimpleMeterRegistry fallback.
management.prometheus.metrics.export.enabled=true
