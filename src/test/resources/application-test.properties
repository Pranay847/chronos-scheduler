# Test overrides, loaded as a PROFILE overlay on top of the main application.properties.
#
# Deliberately NOT src/test/resources/application.properties. A file of that name on the test
# classpath does not merge with the main one — it REPLACES it, silently. Everything configured for
# production (the Prometheus exporter, actuator exposure, every chronos.* tunable) simply stops
# existing during tests, and the only symptom is whichever setting had no code-level default
# failing in a way that looks unrelated. A profile-specific file overlays instead.
#
# Both switches below are OFF in production:
#
#  - allow-private-targets: the fake receiver is WireMock on 127.0.0.1, exactly what the SSRF guard
#    exists to block. SsrfGuardTest asserts the real behaviour with the guard enabled.
#  - require-api-key: the suites written before Phase 6 predate authentication.
#    TenantIsolationTest turns it back on and asserts isolation properly.
chronos.security.allow-private-targets=true
chronos.security.require-api-key=false
