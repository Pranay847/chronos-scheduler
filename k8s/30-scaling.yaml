# Availability and scaling policy.
#
# The PDB is the one that earns its place immediately. The HPA is included because horizontal
# scaling is a real property of this design, but read the honest caveat before claiming it works.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chronos-worker
  namespace: chronos
spec:
  # Voluntary disruptions only -- node drains, cluster upgrades, `kubectl drain`. Without this a
  # drain can evict all three replicas at once and the fleet goes to zero during routine
  # maintenance. minAvailable: 2 means the eviction API refuses the third eviction until a
  # replacement is Ready.
  #
  # This does NOT protect against involuntary disruption: a SIGKILLed pod, an OOM kill, or a node
  # that dies is not an eviction and the PDB has no say. That case is covered by the application's
  # lease recovery, which is what the chaos test exercises. The two mechanisms are complementary and
  # neither replaces the other.
  minAvailable: 2
  selector:
    matchLabels: { app: chronos-worker }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chronos-worker
  namespace: chronos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chronos-worker
  minReplicas: 2
  # Five, not ten, and the difference was measured rather than guessed.
  #
  # At 10 the autoscaler worked perfectly and the cluster could not honour it. Ten workers at the
  # 768Mi limit below want 7.7GB on a node with 7.6GB allocatable that is also running MongoDB,
  # Prometheus, the adapter and the sink. Under a 40,000-job backlog the JVMs grew into their limits,
  # the kernel killed them, and each kill dropped leases the reaper then had to recover on a node
  # already out of memory. Ready replicas peaked at 6 and repeatedly hit zero; the backlog drained
  # SLOWER than it had with the two replicas it started from.
  #
  # That is the failure worth internalising: maxReplicas is a statement about hardware, not an
  # ambition. Set above what the nodes can actually run, the HPA faithfully requests a fleet that
  # thrashes, and a correct autoscaler makes throughput worse. Raise this only alongside node
  # capacity -- and remember the ceiling is the database too, since every replica claims against one
  # replica set.
  maxReplicas: 5
  metrics:
    # Scales on backlog, not CPU. `scheduler_jobs_due_depth` is the count of jobs whose scheduled
    # time has passed and which no worker has claimed -- work that is already late. That is the
    # thing another worker actually fixes.
    #
    # CPU was the obvious choice and the wrong one. A worker polls every 200ms and dispatches on
    # virtual threads, so under a delivery-heavy load it is parked on network I/O rather than
    # burning CPU: throughput can climb while utilisation stays flat, and the autoscaler never
    # fires during precisely the overload it exists to handle. Where CPU does move it tends to
    # track JSON serialisation on the API path, which is unrelated to whether jobs are firing late.
    #
    # `type: External` with `AverageValue` gives the semantics wanted here:
    #     desiredReplicas = ceil(depth / averageValue)
    # so averageValue reads as "overdue jobs one worker should be responsible for". 200 overdue with
    # a target of 100 means 2 replicas; 1000 means 10.
    #
    # NOT `type: Pods`. That averages the metric across pods before dividing, and since every worker
    # exports the same fleet-wide depth the average is just the depth again -- giving
    # `currentReplicas * depth / target`, which over-scales by a factor of the current replica count
    # and gets worse every time it scales. The aggregation trap in the adapter config has a matching
    # trap here, and both have to be right.
    - type: External
      external:
        metric:
          name: chronos_jobs_due_depth
        target:
          type: AverageValue
          averageValue: "150"
  behavior:
    scaleDown:
      # Scaling in drops a worker holding leases. Those jobs are recovered -- graceful shutdown
      # hands back claims, and anything missed expires and is reaped -- but recovery is not free,
      # so a five-minute window stops the HPA flapping replicas on brief dips.
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30

# ---------------------------------------------------------------------------------------------
# WHAT THIS DOES AND DOES NOT DEMONSTRATE.
#
# It scales on queue depth, which is the correct signal, and it needs no metrics-server: the only
# metric here is external, served by prometheus-adapter (k8s/51-prometheus-adapter.yaml) out of
# Prometheus (k8s/50-prometheus.yaml). Dropping the CPU metric dropped that dependency with it.
#
# What it still cannot do is scale the database. Adding workers adds contention on one MongoDB
# replica set, and the claim is a single atomic findAndModify against one collection. Past some
# number of workers, more replicas mean more contention on the same document range rather than more
# throughput -- so maxReplicas is a real limit, not a formality, and the right value depends on
# hardware nobody here has measured.
#
# Nor is queue depth a leading indicator. `scheduler_jobs_due_depth` counts jobs that are ALREADY
# late; by the time it rises, drift has happened. It is the right thing to scale on because it is
# unambiguous, not because it is early. A predictive signal would look at scheduled arrival rate
# ahead of now -- more useful and much easier to get wrong.
#
# The 10s gauge refresh and 5s scrape put roughly 10-20s of lag between a backlog forming and the
# HPA seeing it, on top of the HPA's own 15s sync. Fine for load that persists for minutes;
# invisible to a two-second spike.
